<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mitglied Werden</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --plum:     #4B0082;
      --violet:   #6A0DAD;
      --lavender: #C4A0DC;
      --mist:     #F5F0FA;
      --ink:      #2E1A47;
      --line:     #D9CDE8;
    }

    body {
      min-height: 100vh;
      background: var(--mist);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Jost', sans-serif;
      padding: 2rem 1rem;
      background-image:
        radial-gradient(ellipse 70% 60% at 80% 10%, #e8d8f7 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 10% 90%, #d8c8ef 0%, transparent 55%);
    }

    .card {
      background: #fff;
      border-radius: 2px;
      padding: 3.5rem 3rem 3rem;
      width: 100%;
      max-width: 480px;
      box-shadow:
        0 2px 4px rgba(75,0,130,0.06),
        0 12px 40px rgba(75,0,130,0.10),
        4px 4px 0 var(--lavender);
      position: relative;
      animation: fadeUp 0.6s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* decorative bar */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--plum), var(--lavender), var(--plum));
    }

    .heading {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.2rem;
      font-weight: 600;
      color: var(--plum);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      line-height: 1.1;
      margin-bottom: 0.35rem;
    }

    .subline {
      font-size: 0.78rem;
      font-weight: 300;
      letter-spacing: 0.18em;
      color: var(--lavender);
      text-transform: uppercase;
      margin-bottom: 2.4rem;
    }

    .field {
      margin-bottom: 1.4rem;
      animation: fadeUp 0.5s ease both;
    }
    .field:nth-child(1) { animation-delay: 0.10s; }
    .field:nth-child(2) { animation-delay: 0.18s; }
    .field:nth-child(3) { animation-delay: 0.26s; }
    .field:nth-child(4) { animation-delay: 0.34s; }
    .field:nth-child(5) { animation-delay: 0.42s; }

    label {
      display: block;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--violet);
      margin-bottom: 0.45rem;
    }

    label .req {
      color: var(--lavender);
      margin-left: 2px;
    }

    input {
      width: 100%;
      border: none;
      border-bottom: 1.5px solid var(--line);
      padding: 0.55rem 0.1rem;
      font-family: 'Jost', sans-serif;
      font-size: 0.95rem;
      font-weight: 300;
      color: var(--ink);
      background: transparent;
      transition: border-color 0.25s, box-shadow 0.25s;
      outline: none;
    }

    input::placeholder {
      color: #c8b8de;
      font-style: italic;
    }

    input:focus {
      border-bottom-color: var(--violet);
      box-shadow: 0 2px 0 -1px var(--lavender);
    }

    .divider {
      height: 1px;
      background: var(--line);
      margin: 1.8rem 0 1.6rem;
      opacity: 0.6;
    }

    .btn {
      display: inline-block;
      background: var(--plum);
      color: #fff;
      font-family: 'Jost', sans-serif;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      border: none;
      padding: 0.9rem 2.6rem;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: background 0.25s, transform 0.15s;
    }

    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, transparent 60%);
      pointer-events: none;
    }

    .btn:hover {
      background: var(--violet);
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .note {
      margin-top: 1.5rem;
      font-size: 0.7rem;
      color: var(--lavender);
      letter-spacing: 0.05em;
      line-height: 1.6;
    }

    .note a {
      color: var(--violet);
      text-decoration: none;
    }

    /* success banner (shown after submission) */
    .success-banner {
      display: none;
      background: #f0e8fa;
      border-left: 3px solid var(--violet);
      padding: 0.8rem 1rem;
      margin-bottom: 1.5rem;
      font-size: 0.85rem;
      color: var(--violet);
    }
  </style>
</head>
<body>

<div class="card">
  <p class="heading">Mitglied Werden</p>
  <p class="subline">Jetzt registrieren</p>

  <!-- 
    SETUP INSTRUCTIONS:
    1. Go to https://formspree.io and sign up free
    2. Create a new form and get your form ID (looks like: xpzgkwrd)
    3. Replace YOUR_FORM_ID below with your actual form ID
    4. Formspree will forward submissions to whichever email you register with
  -->
  <form action="https://formspree.io/f/xqeykbyr" method="POST">

    <div class="field">
      <label>Name <span class="req">*</span></label>
      <input type="text" name="name" placeholder="Vor- und Nachname" required />
    </div>

    <div class="field">
      <label>E-Mail <span class="req">*</span></label>
      <input type="email" name="email" placeholder="ihre@email.de" required />
    </div>

    <div class="field">
      <label>Handynummer <span class="req">*</span></label>
      <input type="tel" name="phone" placeholder="+41 79 000 00 00" required />
    </div>

    <div class="field">
      <label>Geburtsdatum</label>
      <input type="date" name="birthdate" />
    </div>

    <div class="field">
      <label>Adresse</label>
      <input type="text" name="address" placeholder="Strasse, PLZ, Ort" />
    </div>

    <!-- hidden field to set reply-to -->
    <input type="hidden" name="_replyto" value="email" />

    <div class="divider"></div>

    <button type="submit" class="btn">Absenden</button>

    <p class="note">
      Mit dem Absenden stimmen Sie unserer Datenschutzrichtlinie zu.<br/>
      Pflichtfelder sind mit <span style="color:var(--violet)">*</span> markiert.
    </p>

  </form>
</div>

</body>
</html>
